<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>高雄昭和鳥瞰 3D</title>
<style>
  :root { --ink:#2A211A; --paper:#E8DBBA; --paper-hi:#EFE4C6; --shu:#9E3B2E; }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfc6ae; font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; color:var(--ink); }
  #sky { position:fixed; inset:0; background:linear-gradient(#b9c3c4 0%, #d6d1bb 45%, #ddd2b4 100%); }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #panel { z-index:2; position:fixed; left:12px; top:12px; background:rgba(232,219,186,.92); border:1.5px solid var(--ink); box-shadow:3px 3px 0 rgba(42,33,26,.25); padding:10px 12px 10px; max-width:calc(100vw - 48px); }
  #panel h1 { margin:0 0 8px; font-size:17px; letter-spacing:.08em; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:13px; padding:5px 9px; background:var(--paper-hi); color:var(--ink); border:1px solid var(--ink); cursor:pointer; }
  button[aria-pressed="true"] { background:var(--shu); color:var(--paper-hi); }
  #hint { margin-top:8px; font-size:12px; opacity:.75; }
  #legend { z-index:2; position:fixed; right:12px; bottom:12px; background:rgba(232,219,186,.92); border:1.5px solid var(--ink); padding:8px 10px; font-size:12px; line-height:1.7; }
  #legend i { display:inline-block; width:26px; height:0; border-top:3px solid; vertical-align:middle; margin-right:6px; }
  #legend i.dash { border-top-style:dashed; }
  #load { z-index:3; position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; background:rgba(221,210,180,.85); transition:opacity .6s; }
  @media (max-width:600px) { #legend { display:none; } #panel h1 { font-size:15px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="sky"></div>
<div id="panel">
  <h1>高雄昭和鳥瞰 3D</h1>
  <div class="row">
    <button id="bView">鳥瞰視角</button>
    <button id="bTop">俯視全圖</button>
    <button id="bLabels" aria-pressed="true">名牌</button>
    <button id="bRoutes" aria-pressed="true">路線</button>
    <button id="bHi" aria-pressed="false">高畫質貼圖</button>
  </div>
  <div id="hint">拖曳旋轉・右鍵或雙指平移・滾輪或雙指縮放</div>
</div>
<div id="legend">
  <div><i style="border-color:#7C2B27"></i>捷運紅線</div>
  <div><i style="border-color:#A2602F"></i>捷運橘線</div>
  <div><i class="dash" style="border-color:#94792F"></i>捷運黃線</div>
  <div><i style="border-color:#41593A"></i>環狀輕軌</div>
  <div><i style="border-color:#3A3029"></i>國道、快速道路</div>
</div>
<div id="load">地圖載入中…</div>
<script type="module" src="main.js"></script>
</body>
</html>
